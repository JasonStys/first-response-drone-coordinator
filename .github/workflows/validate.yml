# Jason Stys: real cross-platform SQLite/API, browser, performance and dependency validation; no artifact/cache uploads.
name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci --ignore-scripts --no-audit
      - run: node --test tools/check_browser_host.test.mjs
      - run: python -m ruff check coordinator tests tools
      - run: python -m ruff format --check coordinator tests tools
      - run: python tools/docs_index.py --check
      - run: npm run format:check && npm test && npm run build
      - name: Full Python coverage with actual native widgets
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run
            xvfb-run -a python -m pytest --cov=coordinator --cov-report=term-missing
          else
            python -m pytest --cov=coordinator --cov-report=term-missing
          fi
      - run: python tools/check_repo.py --dist
      - run: python tools/benchmark.py
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: python -m pip_audit --disable-pip --no-deps -r requirements-dev.lock -r requirements-package.lock
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        name: Required live OSV audit / complete locked npm inventory / zero findings
        run: python tools/audit_osv.py
  browser:
    name: Actual API / Chromium + Firefox + WebKit
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24', package-manager-cache: false}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci --ignore-scripts --no-audit && npm run build
      - name: Require all three actual locked browser engines
        timeout-minutes: 5
        run: node tools/check_browser_host.mjs chromium firefox webkit
      - run: npm run test:e2e
