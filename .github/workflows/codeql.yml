# Jason Stys: Python and TypeScript security-and-quality analysis without cache or database uploads.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 11 * * 4'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: '${{ matrix.language }}'
          build-mode: none
          queries: security-and-quality
          trap-caching: false
          dependency-caching: false
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with: {upload-database: false}
